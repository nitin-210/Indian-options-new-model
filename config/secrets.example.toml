# Copy this file to secrets.toml (same folder) and fill in your own values.
# secrets.toml is git-ignored and is never logged, printed or sent to the browser.
# Do not paste these values into a chat.

[angel]
# API key of your SmartAPI app (smartapi.angelone.in -> My Profile -> My APIs).
api_key = "PASTE_HERE"

# Your Angel One client ID (the one you log in with), e.g. A1234567.
client_code = "PASTE_HERE"

# Your 4-digit Angel One MPIN.
pin = "PASTE_HERE"

# The TOTP secret: the text key shown under the QR code on
# smartapi.angelone.in/enable-totp (letters and digits, no spaces needed).
totp_secret = "PASTE_HERE"

# Optional: only if Angel gave you a separate key for historical data.
historical_api_key = ""

# Optional: the static IPv4 address you registered on the app (sent as a header).
public_ip = ""

# ---------------------------------------------------------------------------------------------
# Using UPSTOX instead of Angel One? Fill in only this section (leave the [angel] one as it is).
# The app uses Upstox whenever this token is set.
#
# Get the token: upstox.com/developer/apps -> "Analytics" tab -> Generate Token.
# It is read-only (it cannot place orders), lasts a year, and needs no daily login.
[upstox]
access_token = "PASTE_YOUR_ANALYTICS_TOKEN_HERE"
